<style>
:root,[data-theme=day]{--bg:#e9ecf1;--c:#fff;--t:#000;--m:#2b3646;--b:#1e293b;--p:#0b3bd6;--pt:#fff;--ok:#0a6b25;--okt:#fff;--okbg:#d2f4da;--wn:#b3001b;--wnt:#fff;--wnbg:#ffdadd;--run:#8a4b00;--runt:#fff;--runbg:#ffe8a3;--hd:#0b1220;--hdt:#fff}
[data-theme=night]{--bg:#000;--c:#10151c;--t:#f5f7fa;--m:#b6c1d1;--b:#46556c;--p:#ffb21f;--pt:#1a1100;--ok:#5ce58a;--okt:#00170a;--okbg:#0b2a17;--wn:#ff8f9a;--wnt:#2a0006;--wnbg:#3d0c14;--run:#ffc857;--runt:#1f1500;--runbg:#3a2a04;--hd:#05070a;--hdt:#f5f7fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--fs,1));-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--t);font-weight:600;line-height:1.35;padding-bottom:calc(5.6rem + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:720px;margin:0 auto;padding:.4rem .7rem}
input,textarea{width:100%;min-height:3rem;padding:.5rem .7rem;border:2px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font-size:1rem;font-weight:700}
input{min-width:0}
input[type=time],input[type=date]{direction:ltr;text-align:center;font-size:1.05rem;padding:.4rem .25rem}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
input[type=number]{direction:ltr;text-align:center;font-size:1.2rem}
textarea{resize:vertical;margin:.5rem 0}
::placeholder{color:var(--m);opacity:.9}
button{min-height:3rem;border:2px solid var(--p);background:var(--p);color:var(--pt);border-radius:14px;padding:.5rem .9rem;font-weight:800;font-size:1rem;cursor:pointer;user-select:none}
button.o{background:transparent;color:var(--t);border-color:var(--b)}
button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
button.onw{background:var(--wn);color:var(--wnt);border-color:var(--wn)}
button.dng{color:var(--wn);border-color:var(--wn)}
button:active{transform:scale(.97);filter:brightness(1.2)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button small{display:block;font-size:.7rem;font-weight:700;opacity:.9}
.big{width:100%;min-height:3.8rem;font-size:1.25rem}
.go{background:var(--ok);border-color:var(--ok);color:var(--okt)}
.stop{background:var(--run);border-color:var(--run);color:var(--runt)}
.wide{width:100%;margin-top:.55rem}
.row{display:flex;gap:.5rem;align-items:flex-start}.row>*{flex:1;min-width:0}
.mt{margin-top:.7rem}
.lbl{font-size:.85rem;color:var(--m);font-weight:800;margin:.35rem 0 .25rem}
.m{color:var(--m)}
/* header / nav */
#hd{position:sticky;top:0;z-index:20;background:var(--hd);color:var(--hdt);padding:.5rem .8rem;padding-top:calc(.5rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.5rem}
.ht{flex:1;min-width:0}.ht b{font-size:1.2rem;display:block}.ht small{font-size:.8rem;opacity:.9;font-weight:700}
.hb{min-height:2.8rem;min-width:2.8rem;padding:0 .5rem;background:transparent;color:var(--hdt);border:2px solid var(--hdt);font-size:1.1rem}
#nv{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--c);border-top:3px solid var(--b);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
#nv button{border:0;border-radius:0;background:transparent;color:var(--t);min-height:4.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.95rem;border-top:5px solid transparent;margin-top:-3px}
#nv button span{font-size:1.5rem;line-height:1}
#nv button.on{color:var(--p);border-top-color:var(--p)}
/* flights */
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{min-height:2.7rem;padding:.3rem .85rem;border-radius:999px}
.rc{min-height:3.2rem;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:.3rem .9rem}
.rc b{font-size:1.1rem}.rc small{font-size:.75rem}
.nw{margin:.7rem 0 .5rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.4rem;margin:.5rem 0}
.seg button{padding:.4rem .3rem;font-size:.95rem}
.empty{text-align:center;color:var(--m);padding:1.5rem 0;font-size:1.1rem}
.fc{background:var(--c);border:2px solid var(--b);border-inline-start:9px solid var(--b);border-radius:16px;margin:.7rem 0;overflow:hidden}
.fc.mv{border-inline-start-color:var(--m)}
.fc.ad{border-inline-start-color:var(--ok)}
.fc.rn{border-inline-start-color:var(--run)}
.fc.hw{border-inline-start-color:var(--wn)}
.fh{padding:.7rem .85rem;cursor:pointer}
.l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem}
.fn{font-size:1.4rem;font-weight:900}
.l2{display:flex;justify-content:space-between;gap:.5rem;margin-top:.15rem;color:var(--m);font-weight:700}
.pr{color:var(--t);font-weight:900}.pr.r{color:var(--run)}
.pb{height:.6rem;background:var(--bg);border:1px solid var(--b);border-radius:9px;overflow:hidden;margin-top:.45rem}
.pb i{display:block;height:100%;background:var(--ok)}
.tag{background:var(--ok);color:var(--okt);border-radius:8px;padding:0 .4rem;font-size:.85rem}.tag.w{background:var(--wn);color:var(--wnt)}
.bd{padding:0 .8rem .9rem;border-top:2px dashed var(--b)}
.tiles{margin-top:.7rem}
.tile{border:2px solid var(--b);border-radius:14px;padding:.5rem;min-width:0}
.tr{display:flex;gap:.4rem}.tr input{flex:1}.sq{min-width:2.6rem;flex:0 0 2.6rem;padding:0}
.sec{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:900;margin:.9rem 0 .2rem}
.sv{border:2px solid var(--b);border-radius:14px;padding:.55rem;margin:.5rem 0;background:var(--c)}
.sv.done{background:var(--okbg);border-color:var(--ok)}
.sv.run{background:var(--runbg);border-color:var(--run)}
.sv.wn{background:var(--wnbg);border-color:var(--wn)}
.svh{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.svh .ic{font-size:1.5rem}.svh b{flex:1;font-size:1.1rem}
.qs{display:flex;align-items:center;gap:.25rem;direction:ltr}
.qs button{min-height:2.6rem;min-width:2.6rem;padding:0;font-size:1.3rem}
.qs b{min-width:1.8rem;text-align:center;font-size:1.15rem;flex:none}
.tl{display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.5rem}
.tcol{flex:1;min-width:0}
.live{flex:1;text-align:center;font-size:1.5rem;font-weight:900;color:var(--run);padding-bottom:.35rem;font-variant-numeric:tabular-nums}
.dur{flex:0 0 3.6rem;text-align:center;font-size:1rem;font-weight:900;color:var(--ok);padding-bottom:.55rem}
.okb{font-size:1.2rem;font-weight:900;color:var(--ok);text-align:center;padding:.4rem 0}
.acts{display:flex;gap:.4rem;margin-top:.5rem}.acts button{flex:1;min-height:2.8rem;padding:.2rem .3rem;font-size:.95rem}
.wb{margin-top:.5rem}.wb input{margin-top:.45rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:.85rem;font-weight:800;color:var(--m);margin:0 0 .2rem}
.qk{margin-top:.4rem}
.add{margin-top:.6rem}

.card h3{margin:0 0 .6rem;font-size:1.1rem}
.ri .m{margin:.25rem 0 .5rem;font-size:.9rem}
.hint{color:var(--m);font-size:.9rem;font-weight:600;margin:.5rem 0 0}

#toast{position:fixed;inset-inline:.8rem;bottom:calc(5.8rem + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;z-index:50;background:var(--hd);color:var(--hdt);border:2px solid var(--p);border-radius:14px;padding:.6rem .9rem;display:flex;align-items:center;gap:.8rem;font-weight:800}
#toast span{flex:1}#toast button{min-height:2.6rem;color:var(--hdt);border-color:var(--hdt)}
#ov{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sh{background:var(--c);width:100%;max-width:720px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));border:2px solid var(--b)}
#sh h3{margin:0 0 .7rem}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.sb{min-height:3.8rem;display:flex;gap:.5rem;align-items:center;justify-content:flex-start;font-size:1.05rem;text-align:start}
.sb span{font-size:1.5rem}
/* voice */
#mic{position:fixed;inset-inline-end:1rem;bottom:calc(5.9rem + env(safe-area-inset-bottom));width:4.6rem;height:4.6rem;min-height:0;border-radius:50%;font-size:2rem;padding:0;z-index:40;box-shadow:0 4px 16px #0008;border:3px solid var(--c);display:flex;align-items:center;justify-content:center}
#mic.lis{background:var(--wn);border-color:var(--wn);color:var(--wnt);animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 16px #ff4d4d55}}
body.vm #toast{bottom:calc(11.2rem + env(safe-area-inset-bottom))}
body.vm main{padding-bottom:2.5rem}
#toast span{white-space:pre-line}
.ex{margin:0;padding:0;list-style:none}.ex li{padding:.5rem 0;border-bottom:1px dashed var(--b)}.ex b{display:block;font-size:1.05rem}.ex small{color:var(--m);font-weight:700}

.dbar{display:flex;gap:.45rem;align-items:stretch;direction:ltr;margin:.25rem 0}
.bd>.dbar{margin-top:.7rem}
.dbar .sq{min-height:3.4rem;flex:0 0 3.4rem;font-size:1.2rem}
.dtx{position:relative;flex:1;min-width:0;border:2px solid var(--b);border-radius:14px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3rem .5rem;text-align:center}
[dir=rtl] .dtx{direction:rtl}[dir=ltr] .dtx{direction:ltr}
.dtx b{font-size:1.1rem}.dtx small{font-size:.8rem;color:var(--m)}
.dtx input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;padding:0;border:0}
.dbar.x .dtx{border-color:var(--run);background:var(--runbg)}
.dbar.x .dtx small{color:var(--t)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:1rem .2rem .1rem;padding:.3rem .2rem;border-bottom:3px solid var(--b);font-weight:900;font-size:1.05rem}
.dh span{color:var(--m);font-size:.9rem}.dh.td{border-bottom-color:var(--p);color:var(--p)}
.dch{display:inline-block;border:2px solid var(--b);border-radius:8px;padding:0 .4rem;color:var(--t);font-weight:900}
.dch.x{background:var(--runbg);border-color:var(--run)}
.fc{scroll-margin-top:4.8rem}
</style>

/* ============ State ============ */
const KEY="rn",FS=[.9,1,1.15,1.3,1.5],LS={al:"d_al",rg:"d_rg",ac:"d_ac",sp:"d_sp"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;");
const tm=v=>{let d=String(v||"").replace(/\D/g,"");if(d.length==3)d="0"+d;if(d.length!=4||+d.slice(0,2)>23||+d.slice(2)>59)return"";return d.slice(0,2)+":"+d.slice(2)};
function load(){
 let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 d=d&&typeof d==="object"?d:{};
 d.fl=Array.isArray(d.fl)?d.fl:[];d.sc=Array.isArray(d.sc)?d.sc:[];
 d.h=Object.assign({al:{},rg:{},ac:{},sp:{}},d.h);d.rm=d.rm||{};
 d.set=Object.assign({lang:"ar",theme:"auto",fs:1,keep:14,vl:"auto",vk:0,wd:null},d.set);if(d.set.wd&&!(d.set.wd>=dd(1)))d.set.wd=null;
 d.fl.forEach(normF);d.sc.forEach(c=>{c.t=tm(c.t);c.sv=c.sv||[]});
 return d}
function normF(f){
 f.s=Array.isArray(f.s)?f.s:[];
 ["n","al","ac","rg","sp","pa","pd","nt"].forEach(k=>f[k]=f[k]==null?"":String(f[k]));
 f.d=f.d||dd(0);["st","ta","td"].forEach(k=>f[k]=tm(f[k]));
 f.s.forEach(s=>{s.f=tm(s.f);s.t=tm(s.t);s.q=s.q||"1";s.wr=s.wr||[];s.nt=s.nt||""});
 f.o=f.o?1:0;f.ok=f.ok?1:0;f.dt=f.dt?1:0;f.id=f.id||Date.now();return f}
const dd=n=>{const d=new Date(Date.now()-n*864e5);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
/* ---- dates ---- */
const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(s,n)=>{const d=pd(s)||pd(dd(0));d.setDate(d.getDate()+n);return iso(d)};
const dloc=()=>D.set.lang==="en"?"en-GB":"ar-EG-u-nu-latn";
const dlab=s=>{const d=pd(s);if(!d)return s||"";try{return d.toLocaleDateString(dloc(),{weekday:"long",day:"numeric",month:"long"})}catch(e){return s}};
const dshort=s=>{const d=pd(s);if(!d)return s||"";try{return d.toLocaleDateString(dloc(),{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}};
const drel=s=>{const t0=dd(0);return s===t0?t("today"):s===addD(t0,1)?t("tomorrow"):s===addD(t0,-1)?t("yesterday"):""};
const wdate=()=>D.set.wd||dd(0);
let D=load(),TAB=1,FLT="open",UNDO=null,LASTU=null,LASTF=null,TT,SHEET_FID=null,DEF=null,selS=new Set(),eid=null;
const L=()=>D.set.lang==="en"?"en":"ar";
const t=(k,v)=>{let s=T[L()][k]??T.ar[k]??k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const nmOf=x=>L()==="en"?x.e:x.a;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast(t("saveFail"))}};
function undoer(){const snap=JSON.stringify(D);return()=>{const set=D.set;D=JSON.parse(snap);D.set=set;save();R1();hdr();if(TAB===2)RS()}}

/* ============ Time helpers ============ */
const nw=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const mins=h=>{const m=/^(\d\d):(\d\d)$/.exec(h||"");return m?+m[1]*60+ +m[2]:null};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dur=(a,b)=>{a=mins(tm(a));b=mins(tm(b));if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d};
const elapsed=f=>{const a=mins(tm(f));if(a==null)return null;let d=nowM()-a;if(d<0)d+=1440;return d};
const fmtMin=m=>m==null?"":m<60?`${m} ${t("min")}`:`${Math.floor(m/60)}${t("h")} ${m%60}${t("min")}`;

/* ============ Suggestions memory ============ */
const lrn=(k,v)=>{v=String(v||"").trim();if(v)D.h[k][v]=(D.h[k][v]||0)+1};
const unl=(k,v)=>{if(v&&D.h[k][v]&&--D.h[k][v]<=0)delete D.h[k][v]};
const tp=k=>Object.entries(D.h[k]||{}).sort((a,b)=>b[1]-a[1]).slice(0,40);
function dlists(){for(const k in LS)$(LS[k]).innerHTML=tp(k).map(([v])=>`<option value="${esc(v)}">`).join("")}

/* ============ Service helpers ============ */
const svOf=s=>SV.find(x=>x.k===s.k)||{a:s.k,e:s.k,i:"•"};
const sname=s=>s.k==="oth"?(s.nm||t("other")):nmOf(svOf(s));
const sst=s=>s.t?"done":s.f?"run":s.dn?"dnx":"idle";
const cnt=f=>f.s.filter(s=>s.t||s.dn).length+"/"+f.s.length;
function wtxt(s){const r=(s.wr||[]).map(k=>t("wr_"+k));if(s.nt)r.push(s.nt);return r.join("، ")||t("issue")}

/* ============ Rendering: flights ============ */
const fld=(lab,inner,c="")=>`<div class="fld ${c}"><label>${lab}</label>${inner}</div>`;
const inp=(a,v,o={})=>`<input data-a="${a}" value="${esc(v)}"${o.type?` type="${o.type}"`:""}${LS[a]?` list="${LS[a]}"`:""}${o.m?` inputmode="${o.m}"`:""}${o.cap?` autocapitalize="characters"`:""}${o.ac?` autocomplete="off"`:""}>`;
const chipsRow=(f,k)=>{const a=tp(k).slice(0,6);return a.length?`<div class="chips qk">${a.map(([v])=>`<button class="o chip ${f[k]===v?"on":""}" data-b="pick" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`:""};
function ccls(f){return(f.ok?"mv ":"")+(f.s.length&&f.s.every(s=>s.t||s.dn)?"ad ":"")+(f.s.some(s=>sst(s)==="run")?"rn ":"")+(f.s.some(s=>s.w)||f.nt?"hw":"")}
function fhIn(f){
 const tot=f.s.length,dn=f.s.filter(s=>s.t||s.dn).length,run=f.s.some(s=>sst(s)==="run"),wn=f.s.some(s=>s.w)||f.nt;
 return `<div class="l1"><span class="fn">${esc(f.n)||t("flight")}</span><span class="m">${esc(f.al)}</span><span class="m">${esc(f.ac)}</span><span class="m">${esc(f.rg)}</span>${f.ok?`<span class="tag">✓</span>`:""}${wn?`<span class="tag w">⚠</span>`:""}</div>
<div class="l2"><span><span class="dch ${f.d===dd(0)?"":"x"}">${esc(dshort(f.d))}</span>${f.st?" · "+esc(f.st):""}${f.sp?" · "+t("stand").split(" ")[0]+" "+esc(f.sp):""}</span>${tot?`<span class="pr ${run?"r":""}">${dn}/${tot}</span>`:""}</div>${tot?`<div class="pb"><i style="width:${Math.round(dn/tot*100)}%"></i></div>`:""}`}
function row(s,i){
 const st=sst(s),cls=(st==="done"||st==="dnx"?"done":st==="run"?"run":"")+(s.w?" wn":"");
 const tin=(a,lab,v)=>`<div class="tcol"><span class="lbl">${lab}</span><input type="time" data-a="${a}" value="${esc(v)}"></div>`;
 let main;
 if(st==="idle")main=`<button class="big go" data-b="nf">▶ ${t("start")}</button>`;
 else if(st==="run")main=`<div class="tl">${tin("f",t("from"),s.f)}<div class="live" data-run data-f="${esc(s.f)}">${fmtMin(elapsed(s.f))}</div></div><button class="big stop" data-b="nt">■ ${t("end")}</button>`;
 else if(st==="done")main=`<div class="tl">${tin("f",t("from"),s.f)}${tin("t",t("to"),s.t)}<div class="dur">${fmtMin(dur(s.f,s.t))}</div></div>`;
 else main=`<div class="okb">✔ ${t("doneNoTime")}</div><button class="o wide" data-b="nf" style="margin-top:0">▶ ${t("start")}</button>`;
 const wb=s.w?`<div class="wb"><div class="chips">${WR.map(k=>`<button class="o chip ${(s.wr||[]).includes(k)?"onw":""}" data-b="wrk" data-k="${k}">${t("wr_"+k)}</button>`).join("")}</div><input data-a="nt" value="${esc(s.nt)}" placeholder="${esc(t("notePh"))}"></div>`:"";
 return `<div class="sv ${cls}" data-i="${i}"><div class="svh"><span class="ic">${svOf(s).i}</span><b>${esc(sname(s))}</b><div class="qs"><button class="o" data-b="qm">−</button><b>${esc(s.q||1)}</b><button class="o" data-b="qp">+</button></div></div>${main}
<div class="acts">${!(s.f||s.t)?`<button class="o ${s.dn?"on":""}" data-b="dn">✓<small>${t("noTime")}</small></button>`:""}<button class="o ${s.w?"onw":""}" data-b="w">⚠<small>${t("issue")}</small></button>${s.f||s.t?`<button class="o" data-b="rs">↺</button>`:""}<button class="o dng" data-b="x">✕</button></div>${wb}</div>`}
function body(f){
 const tile=(k,lab)=>`<div class="tile"><div class="lbl">${lab}</div>${f[k]?`<div class="tr"><input type="time" data-a="${k}" value="${esc(f[k])}"><button class="o sq" data-b="clr" data-k="${k}">✕</button></div>`:`<button class="big go" data-b="now" data-k="${k}">⏱ ${t("now")}</button>`}</div>`;
 const det=`<div class="g mt">${fld(t("flightNo"),inp("n",f.n))}${fld(t("sched"),inp("st",f.st,{type:"time"}))}${fld(t("airline"),inp("al",f.al,{ac:1})+chipsRow(f,"al"),"full")}${fld(t("type"),inp("ac",f.ac,{ac:1})+chipsRow(f,"ac"),"full")}${fld(t("reg"),inp("rg",f.rg,{cap:1,ac:1}))}${fld(t("stand"),inp("sp",f.sp,{ac:1})+chipsRow(f,"sp"),"full")}</div>`;
 return `<div class="bd">${dbarF(f)}<div class="row tiles">${tile("ta",t("chOn"))}${tile("td",t("chOff"))}</div>
<div class="sec"><span>${t("services")}</span><span>${cnt(f)}</span></div>${f.s.map(row).join("")}
<button class="big add o" data-b="add">＋ ${t("addService")}</button>
<div class="g mt">${fld(t("paxA"),inp("pa",f.pa,{type:"number",m:"numeric"}))}${fld(t("paxD"),inp("pd",f.pd,{type:"number",m:"numeric"}))}</div>
<textarea data-a="nt" rows="2" placeholder="${esc(t("genNote"))}">${esc(f.nt)}</textarea>
<button class="o wide" data-b="dt">${f.dt?"▲":"▼"} ${t("details")}</button>${f.dt?det:""}
<div class="row mt"><button data-b="sh">📤 ${t("share")}</button><button class="o" data-b="cp">📋 ${t("copy")}</button></div>
<button class="wide ${f.ok?"o":""}" data-b="ok">${f.ok?"↩ "+t("unmove"):"✓ "+t("moved")}</button>
<button class="o wide dng" data-b="del">🗑 ${t("del")}</button></div>`}
const card=f=>`<article class="fc ${ccls(f)}" data-fid="${f.id}"><div class="fh" data-b="o">${fhIn(f)}</div>${f.o?body(f):""}</article>`;
function rc(f){const el=document.querySelector(`[data-fid="${f.id}"]`);if(el)el.outerHTML=card(f);dlists();hdr()}
function upCard(c,f,r){
 if(r){const i=+r.dataset.i;r.outerHTML=row(f.s[i],i)}
 const h=c.querySelector(".fh");if(h)h.innerHTML=fhIn(f);c.className="fc "+ccls(f);
 const sp=c.querySelector(".sec span:last-child");if(sp)sp.textContent=cnt(f)}
const dbarF=f=>`<div class="dbar${f.d===dd(0)?"":" x"}"><button class="o sq" data-b="dm" aria-label="-1">◀</button><div class="dtx"><b>${esc(dlab(f.d))}</b><small>${esc(drel(f.d)||t("date"))}</small><input type="date" data-a="d" value="${esc(f.d)}"></div><button class="o sq" data-b="dp" aria-label="+1">▶</button></div>`;
const wdBar=()=>{const w=wdate(),x=w!==dd(0);return `<div class="lbl">${t("wdate")}</div><div class="dbar${x?" x":""}"><button class="o sq" data-b="wdm" aria-label="-1">◀</button><div class="dtx"><b>${esc(dlab(w))}</b><small>${esc(drel(w)||"")}</small><input type="date" data-b="wdin" value="${esc(w)}"></div><button class="o sq" data-b="wdp" aria-label="+1">▶</button></div>${x?`<button class="o wide" data-b="wdt">↺ ${t("backToday")}</button>`:""}`};
const focusCard=id=>{const el=document.querySelector(`[data-fid="${id}"]`);if(el)el.scrollIntoView({block:"start"})};
function setWd(v){v=/^\d{4}-\d\d-\d\d$/.test(v||"")?v:dd(0);D.set.wd=v===dd(0)?null:v;save();R1()}
function listHtml(){
 const a=D.fl.filter(f=>FLT==="all"||(FLT==="open"?!f.ok:f.ok));
 if(!a.length)return `<p class="empty">${t("noFlights")}</p>`;
 const T0=dd(0),rk=d=>d===T0?0:d>T0?1:2;
 const ds=[...new Set(a.map(f=>f.d))].sort((x,y)=>rk(x)-rk(y)||(rk(x)===2?(x<y?1:-1):(x<y?-1:1)));
 return ds.map(d=>{
  const fs=a.filter(f=>f.d===d).sort((x,y)=>(x.st||"99:99").localeCompare(y.st||"99:99")||x.id-y.id);
  return `<div class="dh ${d===T0?"td":""}"><b>${esc(dlab(d))}</b><span>${esc(drel(d))}${drel(d)?" · ":""}${fs.length}</span></div>`+fs.map(card).join("")}).join("")}
function R1(){
 const op=D.fl.filter(f=>!f.ok).length,mv=D.fl.length-op;
 const rch=D.sc.slice().sort((a,b)=>(a.t||"").localeCompare(b.t||"")).map(c=>`<button class="o rc" data-b="addr" data-id="${c.id}"><b>${esc(c.n)}</b><small>${esc(c.t)} ${esc(c.al)}</small></button>`).join("")||`<span class="m">${t("noRoutine")}</span>`;
 $("p1").innerHTML=`${wdBar()}<div class="lbl">${t("routineHint")}</div><div class="chips">${rch}</div>
<button class="big nw" data-b="newf">＋ ${t("newFlight")}</button>
<div class="seg">${[["open",op],["moved",mv],["all",D.fl.length]].map(([k,n])=>`<button class="o ${FLT===k?"on":""}" data-b="flt" data-k="${k}">${t("f_"+k)} (${n})</button>`).join("")}</div>
<div id="fl">${listHtml()}</div>${mv?`<button class="o wide" data-b="clrm">🧹 ${t("clearMoved")}</button>`:""}`;
 dlists()}
function addF(c){
 D.fl.forEach(f=>f.o=0);
 let id=Date.now();while(D.fl.some(x=>x.id===id))id++;
 const f={id,d:wdate(),n:"",al:"",ac:"",rg:"",sp:"",st:"",ta:"",td:"",pa:"",pd:"",nt:"",s:[],o:1,ok:0,dt:c?0:1};
 if(c){Object.assign(f,{n:c.n,al:c.al,ac:c.ac,rg:c.rg,sp:c.sp||"",st:tm(c.t)});f.s=(c.sv||[]).map(k=>({k,q:"1",f:"",t:"",w:0,wr:[],nt:""}))}
 D.fl.unshift(f);LASTF=f.id;FLT="open";save();R1();hdr();focusCard(f.id)}

/* ============ Rendering: routine tab ============ */
function buildP2(){
 $("p2").innerHTML=`<div class="card"><h3 id="r_t"></h3><div class="g">${fld(t("flightNo"),`<input id="sn">`)}${fld(t("sched"),`<input id="st" type="time">`)}${fld(t("airline"),`<input id="sa" list="d_al" autocomplete="off">`)}${fld(t("type"),`<input id="sc" list="d_ac" autocomplete="off">`)}${fld(t("reg"),`<input id="sr" list="d_rg" autocapitalize="characters" autocomplete="off">`)}${fld(t("stand"),`<input id="sk" list="d_sp" autocomplete="off">`)}</div>
<div class="lbl mt">${t("usualServices")}</div><div class="chips" id="ss"></div>
<div class="row mt"><button data-b="saveR">💾 ${t("save")}</button><button class="o" data-b="resetR">${t("new")}</button></div></div>
<div class="lbl">${t("routineList")}</div><div id="sl"></div>
<div class="card"><h3>${t("suggest")}</h3><div id="hl"></div></div>`}
function RS(){
 $("r_t").textContent=eid?t("editR"):t("addR");
 $("ss").innerHTML=SV.filter(x=>x.k!=="oth").map(x=>`<button class="o chip ${selS.has(x.k)?"on":""}" data-b="tgs" data-k="${x.k}">${x.i} ${esc(nmOf(x))}</button>`).join("");
 $("sl").innerHTML=D.sc.map(c=>`<div class="card ri"><b>${esc(c.n)}</b> ${esc(c.al)} ${esc(c.ac)} ${esc(c.t)}<div class="m">${(c.sv||[]).map(k=>esc(nmOf(SV.find(x=>x.k===k)||{a:k,e:k}))).join("، ")}</div><div class="row"><button class="o" data-b="editR" data-id="${c.id}">${t("edit")}</button><button class="o dng" data-b="delR" data-id="${c.id}">🗑</button></div></div>`).join("");
 $("hl").innerHTML=[["al","g_al"],["ac","g_ac"],["rg","g_rg"],["sp","g_sp"]].map(([k,n])=>{const a=tp(k);return a.length?`<div class="lbl">${t(n)}</div><div class="chips">${a.map(([v])=>`<button class="o chip" data-b="delH" data-k="${k}" data-v="${esc(v)}">${esc(v)} ✕</button>`).join("")}</div>`:""}).join("")}
function resetS(){eid=null;selS=new Set();["sn","sa","sc","sr","sk","st"].forEach(i=>$(i).value="");RS()}
function saveS(){
 if(!$("sn").value.trim()){toast(t("needNo"));$("sn").focus();return}
 const c={id:eid||Date.now(),n:$("sn").value.trim(),al:$("sa").value.trim(),ac:$("sc").value.trim(),rg:$("sr").value.trim().toUpperCase(),sp:$("sk").value.trim(),t:tm($("st").value),sv:[...selS]};
 ["al","ac","rg","sp"].forEach(k=>lrn(k,c[k]));
 const i=D.sc.findIndex(x=>x.id==c.id);i>=0?D.sc[i]=c:D.sc.push(c);
 save();resetS();R1();dlists();toast(t("savedR"))}

/* ============ Rendering: settings ============ */
function R3(){
 const seg=(act,cur,items)=>`<div class="seg">${items.map(([v,l])=>`<button class="o ${String(cur)===String(v)?"on":""}" data-b="${act}" data-v="${v}">${l}</button>`).join("")}</div>`;
 $("p3").innerHTML=`<div class="card"><h3>🌐 ${t("s_lang")}</h3>${seg("slang",L(),[["ar","العربية"],["en","English"]])}</div>
<div class="card"><h3>🎨 ${t("s_theme")}</h3>${seg("sth",D.set.theme,[["auto",t("th_auto")],["day",t("th_day")],["night",t("th_night")]])}
<div class="lbl mt">${t("s_fs")}</div><div class="row"><button class="o" data-b="fsm">A−</button><button class="o" data-b="fsp">A+</button></div></div>

function csv(){

 const rows=[["Date","Flight","Airline","Type","Reg","Stand","Sched","Chocks on","Chocks off","Pax arr","Pax dep","Service","Qty","Start","End","Minutes","Done no time","Issue","Issue note","Flight notes","Transferred"]];

const W_START=wre(["ابدأ","بدأ","بدأت","بدأنا","بداية","بدء","ابدء","start","started","begin","began","starting"]);
const W_END=wre(["خلص","خلصت","خلصنا","انهي","انتهى","انتهت","انتهينا","انهاء","نهاية","وقف","اقفل","قفل","تم","تمت","end","finish","finished","done","stop","stopped","complete","completed"]);
const NW=new Map(Object.entries({"واحد":1,"واحده":1,one:1,"اتنين":2,"اثنين":2,"اثنان":2,two:2,"تلاته":3,"ثلاثه":3,"تلات":3,three:3,"اربعه":4,"اربع":4,four:4,"خمسه":5,"خمس":5,five:5,"سته":6,"ست":6,six:6,"سبعه":7,"سبع":7,seven:7,"تمانيه":8,"ثمانيه":8,"ثماني":8,eight:8,"تسعه":9,"تسع":9,nine:9,"عشره":10,"عشر":10,ten:10,"صفر":0,zero:0}));
function numIn(n){const m=/\d+/.exec(n);if(m)return+m[0];for(const w of n.split(" "))if(NW.has(w))return NW.get(w);return null}
function takeTime(n){const m=/(^| )(?:ساعه|at)\s+(\d{1,2})(?:#(\d{2})|\s(\d{2}))?(?= |$)/.exec(n);if(!m)return[n,null];const h=+m[2],mi=+(m[3]||m[4]||0);if(h>23||mi>59)return[n,null];return[(n.slice(0,m.index)+" "+n.slice(m.index+m[0].length)).replace(/\s+/g," ").trim(),String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0")]}
function parseCmd(raw){
 const rc=vclean(raw);if(!rc)return null;
 let n=vnorm(raw),m,tv;
 if(/^(تراجع|ارجع|الغي|الغاء|اتراجع|undo|revert|cancel)( |$)/.test(n))return{t:"undo"};
 if(/(^| )(رحله (جديده|فاضيه|فارغه)|new flight|blank flight)( |$)/.test(n))return{t:"newf"};
 if(/(^| )(تم نقل|نقلت|منقوله|منقول|transferred|mark transferred|marked as transferred)( |$)/.test(n))return{t:"moved"};
 if(m=/^(?:ملاحظ[هة]|ملحوظ[هة]|ملاحظات|notes?)\s+(.+)$/i.exec(rc))return{t:"note",txt:m[1].replace(/(\d)#(\d)/g,"$1:$2")};
 if(m=/^(?:افتح |ضيف |اضف |زود |open |add |select |goto |go to )?(?:رحله|flight)\s+(.+)$/.exec(n)){const q=m[1],digits=(q.match(/\d+/g)||[]).join(""),letters=(q.match(/[a-z]+/g)||[]).join("");if(digits||letters)return{t:"flight",digits,letters}}
 [n,tv]=takeTime(n);
 if(m=/^(?:موقف|stand|ستاند|استاند)\s+(.+)$/.exec(n)){let v;if(/\d/.test(m[1]))v=m[1].replace(/\s+/g,"").toUpperCase();else{const x=numIn(m[1]);v=x!=null?String(x):m[1].replace(/\s+/g,"").toUpperCase()}v=v.slice(0,8);if(v)return{t:"stand",v}}
 const svs=allSv(n),sv=svs[0]||null;
 if(!sv&&/(^| )(ركاب|pax|passengers?)( |$)/.test(n)){const num=numIn(n);if(num!=null){const dep=/(^| )(سفر|مغادره|مغادرين|صادر|departure|departing|dep|out)( |$)/.test(n),arr=/(^| )(وصول|وصلوا|قادمين|وارد|arrival|arriving|arr|in)( |$)/.test(n);return{t:"pax",dir:dep&&!arr?"d":arr&&!dep?"a":"",n:String(num)}}}
 const CH=/(^| )(chocks?|blocks?|شوكس|شوكز|تشوكس|تشوكز|شوك|بلوكس)( |$)/.test(n);
 const ON=/(^| )(on|اون|اوان|ان|وصول|وصل|وصلت|arrival|arrived)( |$)/.test(n),OFF=/(^| )(off|اوف|اف|سفر|طلعت|مشيت|departure|departed)( |$)/.test(n);
 if(CH&&(ON||OFF))return{t:"chocks",w:OFF?"td":"ta",time:tv};
 if(/(^| )(طياره|طايره|aircraft|plane)( |$)/.test(n)){if(/(^| )(وصلت|وصل|arrived|landed)( |$)/.test(n))return{t:"chocks",w:"ta",time:tv};if(/(^| )(سفرت|مشيت|طلعت|departed|left)( |$)/.test(n))return{t:"chocks",w:"td",time:tv}}
 if(m=/^(تقصير|مشكله|مشاكل|issue|problem|defect|warning)( |$)(.*)$/.exec(n)){const[r2,rs]=takeReasons(m[3]),s1=findSv(r2);if(s1)return{t:"issue",k:s1.k,rs};const txt=rc.replace(/^\S+\s*/,"").replace(/(\d)#(\d)/g,"$1:$2");if(txt||rs.length)return{t:"issue",k:null,rs,txt};return null}
 if(sv&&/^(امسح|احذف|شيل|ازل|remove|delete)( |$)/.test(n))return{t:"rem",k:sv.k};
 if(sv&&/(^| )(بدون وقت|من غير وقت|بلا وقت|no time|without time)( |$)/.test(n))return{t:"dn",k:sv.k};
 if(/^(ضيف|اضف|زود|اضافه|add)( |$)/.test(n)){
  if(svs.length){const num=svs.length===1?numIn(n):null;return{t:"add",items:svs.map(s=>({k:s.k,q:Math.min(99,Math.max(1,num||s.q||1))}))}}
  if(/^(?:ضيف|اضف|زود|add)\s+(?:خدمه|service)\s+\S/.test(n)){const nm=rc.replace(/^\S+\s+\S+\s*/,"").trim();if(nm)return{t:"addc",nm}}
  return null}
 const hs=W_START.test(n),he=W_END.test(n);
 if(sv)return{t:he&&!hs?"end":hs&&!he?"start":"tog",k:sv.k,time:tv};
 if(he&&!hs&&n.split(" ").length<=3)return{t:"endAny",time:tv};
 return null}
function curF(){let f=D.fl.find(x=>x.id===LASTF&&!x.ok);if(f)return f;f=D.fl.find(x=>x.o&&!x.ok);return f||D.fl.filter(x=>!x.ok).sort((a,b)=>b.id-a.id)[0]||null}
function pickSv(f,k,pref){const a=f.s.map((s,i)=>[s,i]).filter(x=>x[0].k===k);if(!a.length)return-1;const order=pref==="start"?["idle","dnx","run","done"]:["run","idle","dnx","done"];for(const o of order){const h=a.find(x=>sst(x[0])===o);if(h)return h[1]}return a[0][1]}
const newSv=(f,k,q)=>{f.s.push({k,q:String(q||1),f:"",t:"",w:0,wr:[],nt:""});return f.s.length-1};
const svLabel=k=>nmOf(SV.find(x=>x.k===k)||{a:k,e:k});
function execCmd(p,f){
 const T_=p.time||nw(),nf=f?(f.n||t("flight")):"";
 switch(p.t){
 case"newf":addF();return{ok:1,msg:"＋ "+t("newFlight"),f:D.fl[0]};
 case"flight":{
  const mt=x=>{const ns=String(x.n||"").toLowerCase().replace(/[^a-z0-9]/g,""),dg=ns.replace(/\D/g,"");return p.digits?dg===p.digits&&(!p.letters||ns.includes(p.letters)):ns===p.letters};
  const wd=wdate();let g=D.fl.find(x=>!x.ok&&x.d===wd&&mt(x))||D.fl.find(x=>!x.ok&&mt(x));
  if(g){D.fl.forEach(x=>x.o=0);g.o=1;LASTF=g.id;return{ok:1,msg:"✈ "+g.n,f:g}}
  const c=D.sc.find(mt);if(c){addF(c);return{ok:1,msg:"＋ ✈ "+c.n,f:D.fl[0]}}
  addF();g=D.fl[0];g.n=p.letters.toUpperCase()+p.digits;return{ok:1,msg:"＋ ✈ "+g.n,f:g}}
 case"moved":f.ok=1;return{ok:1,msg:`✓ ${nf}: ${t("movedT")}`,f,gone:1};
 case"stand":f.sp=p.v;lrn("sp",p.v);return{ok:1,msg:`${nf} · ${t("stand")}: ${p.v}`,f};
 case"pax":{const k=p.dir==="d"?"pd":p.dir==="a"?"pa":(f.pa===""?"pa":"pd");f[k]=p.n;return{ok:1,msg:`${nf} · ${t(k==="pa"?"paxA":"paxD")}: ${p.n}`,f}}
 case"chocks":f[p.w]=T_;return{ok:1,msg:`${nf} · ${t(p.w==="ta"?"chOn":"chOff")} ${T_}`,f};
 case"note":f.nt=f.nt?f.nt+"\n"+p.txt:p.txt;return{ok:1,msg:`${nf} · ${t("sNote")} ✔`,f};
 case"issue":{
  if(p.k){let i=pickSv(f,p.k,"tog");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.w=1;s.wr=s.wr||[];p.rs.forEach(r=>{if(!s.wr.includes(r))s.wr.push(r)});return{ok:1,msg:`⚠ ${nf} · ${sname(s)}${p.rs.length?": "+p.rs.map(r=>t("wr_"+r)).join("، "):""}`,f,idx:i}}
  const txt=p.txt||p.rs.map(r=>t("wr_"+r)).join("، ");f.nt=f.nt?f.nt+"\n⚠ "+txt:"⚠ "+txt;return{ok:1,msg:`⚠ ${nf}: ${txt}`,f}}
 case"add":{let last=-1;const names=[];for(const it of p.items){let i=pickSv(f,it.k,"start");if(i>=0&&sst(f.s[i])==="idle"){if(it.q>1)f.s[i].q=String(it.q)}else i=newSv(f,it.k,it.q);last=i;names.push(sname(f.s[i])+(it.q>1?" ×"+it.q:""))}return{ok:1,msg:`＋ ${nf} · ${names.join("، ")}`,f,idx:last}}
 case"addc":f.s.push({k:"oth",nm:p.nm,q:"1",f:"",t:"",w:0,wr:[],nt:""});return{ok:1,msg:`＋ ${nf} · ${p.nm}`,f,idx:f.s.length-1};
 case"rem":{const i=pickSv(f,p.k,"tog");if(i<0)return{ok:0,msg:`${svLabel(p.k)} — ${t("vNone")}`};const nm=sname(f.s[i]);f.s.splice(i,1);return{ok:1,msg:`✕ ${nf} · ${nm}`,f}}
 case"dn":{let i=pickSv(f,p.k,"start");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.dn=1;s.f="";s.t="";return{ok:1,msg:`✔ ${nf} · ${sname(s)}: ${t("doneNoTime")}`,f,idx:i}}
 case"start":{let i=pickSv(f,p.k,"start");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.f=T_;s.t="";s.dn=0;return{ok:1,msg:`▶ ${nf} · ${sname(s)} ${T_}`,f,idx:i}}
 case"end":{let i=pickSv(f,p.k,"end");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.t=T_;s.dn=0;const d=dur(s.f,s.t);return{ok:1,msg:`■ ${nf} · ${sname(s)} ${T_}${d!=null?" ("+fmtMin(d)+")":""}`,f,idx:i}}
 case"tog":{const i=pickSv(f,p.k,"tog");if(i<0)return execCmd({t:"start",k:p.k,time:p.time},f);const s=f.s[i],st=sst(s);
  if(st==="run")return execCmd({t:"end",k:p.k,time:p.time},f);
  if(st==="done")return{ok:0,msg:`${sname(s)} — ${t("vAlready")}`};
  return execCmd({t:"start",k:p.k,time:p.time},f)}
 case"endAny":{const r=f.s.map((s,i)=>i).filter(i=>sst(f.s[i])==="run");if(!r.length)return{ok:0,msg:t("vNone")};if(r.length>1)return{ok:0,msg:t("vWhich")};return execCmd({t:"end",k:f.s[r[0]].k,time:p.time},f)}
 }
 return{ok:0,msg:t("vNo")}}
const buzz=ok=>{try{navigator.vibrate&&navigator.vibrate(ok?40:[70,50,70])}catch(e){}};
function runCmd(p,heard){
 if(p.t==="undo"){if(LASTU){const u=LASTU;LASTU=null;u();buzz(1);toast("↩ "+t("vUndone"))}else{buzz(0);toast(t("vNothing"))}return}
 let f=null;
 if(p.t!=="newf"&&p.t!=="flight"){f=curF();if(!f){buzz(0);toast(t("vNoFlight"),null,false,3500);return}}
 const u=undoer(),r=execCmd(p,f);
 if(!r.ok){buzz(0);toast(`🎙 «${heard}»\n${r.msg}`,null,false,4000);return}
 buzz(1);save();
 const g=r.f||f;
 if(g&&!r.gone){g.o=1;LASTF=g.id;if((FLT==="moved"&&!g.ok)||(FLT==="open"&&g.ok))FLT="all"}
 R1();hdr();
 if(g&&!r.gone){const el=document.querySelector(`[data-fid="${g.id}"]`+(r.idx!=null?` [data-i="${r.idx}"]`:""));if(el)el.scrollIntoView({block:r.idx!=null?"center":"start"})}
 toast(`${r.msg}\n«${heard}»`,u,false,6000)}
function onSpeech(alts){
 for(const a of alts){const p=parseCmd(a);if(p){runCmd(p,a);return}}
 buzz(0);toast(`🎙 «${alts[0]||""}»\n${t("vNo")} — ${t("vTry")}: «${T[L()].vex[0][0]}»`,null,false,4500)}
let REC=null,LIS=false,WANT=false,FATAL=false;
const micLang=()=>D.set.vl==="auto"?(L()==="ar"?"ar-EG":"en-US"):D.set.vl;
function micUi(){const m=$("mic");if(!m)return;const on=!!SRC&&TAB===1;m.hidden=!on;document.body.classList.toggle("vm",on);m.classList.toggle("lis",LIS);m.textContent=LIS?"⏹":"🎙";m.setAttribute("aria-label",t("s_voice"))}
function micToggle(){if(!SRC){toast(t("vNoSup"),null,false,3500);return}if(WANT||LIS){micStop();return}FATAL=false;WANT=true;micStart(false)}
function micStop(){WANT=false;try{REC&&REC.abort&&REC.abort()}catch(e){}LIS=false;micUi();const el=$("toast");if(el.dataset.l==="1")el.hidden=true}
function micStart(again){
 let r;try{r=new SRC()}catch(e){WANT=false;toast(t("vNoSup"));return}
 REC=r;r.lang=micLang();r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
 r.onstart=()=>{LIS=true;micUi();if(!again)toast("🎙 "+t("vListen"),null,true)};
 r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){const alts=[];for(let j=0;j<res.length;j++)alts.push(res[j].transcript);onSpeech(alts)}else interim+=res[0].transcript}if(interim)toast("🎙 "+interim,null,true)};
 r.onerror=e=>{const c=e&&e.error;if(c==="aborted")return;
  if(c==="not-allowed"||c==="service-not-allowed"){FATAL=true;toast(t("vDenied"),null,false,4000)}
  else if(c==="network"){FATAL=true;toast(t("vNet"),null,false,4000)}
  else if(c==="audio-capture"){FATAL=true;toast(t("vNoMic"),null,false,4000)}
  else if(c==="language-not-supported"){FATAL=true;toast(t("vLangErr"),null,false,4000)}
  else if(c==="no-speech")toast(t("vNoSpeech"),null,false,2000)};
 r.onend=()=>{LIS=false;if(WANT&&D.set.vk&&!FATAL){setTimeout(()=>{if(WANT&&!LIS)micStart(true)},300)}else{WANT=false;const el=$("toast");if(el.dataset.l==="1")el.hidden=true}micUi()};
 try{r.start()}catch(e){WANT=false;micUi()}}

/* ============ Init ============ */
purge();applyTheme();
document.documentElement.lang=L();document.documentElement.dir=L()==="ar"?"rtl":"ltr";document.title=L()==="ar"?"مفكرة المهبط":"Ramp Notes";
D.sc.concat(D.fl).forEach(c=>["al","ac","rg","sp"].forEach(k=>{if(c[k]&&!D.h[k][c[k]])lrn(k,c[k])}));
shell();buildP2();RS();R1();dlists();micUi();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
