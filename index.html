function stats(ds){
 const fs=D.fl.filter(f=>f.d===ds);let tot=0,dn=0,run=0,iss=0,sum=0,n=0;
 fs.forEach(f=>{tot+=f.s.length;f.s.forEach(s=>{if(s.t||s.dn)dn++;if(sst(s)==="run")run++;if(s.w)iss++});
  const d=dur(f.ta,f.td);if(d!=null){sum+=d;n++}});
 return{n:fs.length,tot,dn,run,iss,avg:n?Math.round(sum/n):null}}
function stUpd(){if(!D.set.imp.stats)return;const s=stats(dd(0));const set=(id,v)=>{const el=$(id);if(el)el.textContent=v};
 set("stN",s.n);set("stD",s.dn+"/"+s.tot);set("stR",s.run);set("stW",s.iss);set("stA",s.avg!=null?fmtShort(s.avg):"—")}
function statsHtml(){const s=stats(dd(0));
 return `<div class="stats"><div class="st"><b id="stN">${s.n}</b><small>${t("stN")}</small></div>
<div class="st d"><b id="stD">${s.dn}/${s.tot}</b><small>${t("stD")}</small></div>
<div class="st r"><b id="stR">${s.run}</b><small>${t("stR")}</small></div>
<div class="st w"><b id="stW">${s.iss}</b><small>${t("stW")}</small></div>
<div class="st"><b id="stA">${s.avg!=null?esc(fmtShort(s.avg)):"—"}</b><small>${t("stA")}</small></div></div>`}
function cfSet(){
 const out=new Map();if(!D.set.imp.cf)return out;
 const by={};D.fl.filter(f=>!f.ok&&String(f.sp||"").trim()).forEach(f=>{const k=f.d+"|"+f.sp.trim().toUpperCase();(by[k]=by[k]||[]).push(f)});
 const win=f=>{const a=mins(f.ta);if(a!=null){let b=mins(f.td);if(b==null)b=nowM();if(b<a)b+=1440;return[a,b]}
  const s=mins(f.st);return s==null?null:[s-30,s+45]};
 const add=(id,nm)=>{const a=out.get(id)||[];if(!a.includes(nm))a.push(nm);out.set(id,a)};
 for(const k in by){const a=by[k];if(a.length<2)continue;
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
   const w1=win(a[i]),w2=win(a[j]);if(!w1||!w2)continue;
   if(w1[0]<w2[1]&&w2[0]<w1[1]){add(a[i].id,a[j].n||t("flight"));add(a[j].id,a[i].n||t("flight"))}}}
 return out}
function tlData(f){
 let lo=null,hi=null;const items=[];
 const ta=mins(f.ta),td=mins(f.td);
 if(ta!=null){lo=ta;hi=ta}
 f.s.forEach((s,i)=>{const a=mins(s.f);if(a==null)return;const b0=mins(s.t);let b=b0!=null?b0:nowM();if(b<a)b+=1440;
  items.push({i,a,b,run:b0==null,s});lo=lo==null?a:Math.min(lo,a);hi=hi==null?b:Math.max(hi,b)});
 if(td!=null){let e=td;if(lo!=null&&e<lo)e+=1440;lo=lo==null?e:Math.min(lo,e);hi=hi==null?e:Math.max(hi,e)}
 if(lo==null||hi==null||hi<=lo||!items.length)return null;
 let n=nowM();if(n<lo)n+=1440;
 return{lo,hi,items,now:(n>=lo&&n<=hi)?n:null}}
function tlHtml(f){
 const d=tlData(f);if(!d)return "";const span=d.hi-d.lo;
 const rows=d.items.map(it=>{
  const l=Math.max(0,Math.min(100,(it.a-d.lo)/span*100)),w=Math.max(1.5,Math.min(100-l,(it.b-it.a)/span*100));
  const cls=it.s.w?"wn":it.run?"run":"";
  return `<div class="tlr"><span class="tli">${svOf(it.s).i}</span><div class="tlt"><button class="tlb ${cls}" data-b="tls" data-i="${it.i}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%" title="${esc(sname(it.s))}">${w>17?esc(fmtShort(it.b-it.a)):""}</button>${d.now!=null?`<i class="tln" style="left:${((d.now-d.lo)/span*100).toFixed(2)}%"></i>`:""}</div><span class="tld" dir="ltr">${hm(it.a)}</span></div>`}).join("");
 return `<div class="tlw"><div class="tlh"><span>${t("tlTitle")}</span><span dir="ltr">${hm(d.lo)} → ${hm(d.hi)}</span></div>${rows}</div>`}

const subtle=(window.crypto&&crypto.subtle)?crypto.subtle:null;
const OKLS="rn.ownerkey.v1";
let OWN={blob:null,priv:"",pub:"",owner:"",lic:[],open:false},OWN_PASS="";
const b64=buf=>{const a=new Uint8Array(buf);let s="";for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>{const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a};
const b64u=buf=>b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rid=()=>{const a=crypto.getRandomValues(new Uint8Array(6));let s="";for(let i=0;i<a.length;i++)s+=a[i].toString(36).padStart(2,"0");return s.slice(0,9).toUpperCase()};

const daysLeft=e=>Math.ceil((new Date(e+"T23:59:59")-new Date())/864e5);

function ownLoad(){try{const d=JSON.parse(localStorage.getItem(OKLS));if(d&&d.ct)OWN.blob=d}catch(e){}}
function ownSaveBlob(){try{localStorage.setItem(OKLS,JSON.stringify(OWN.blob))}catch(e){toast(t("saveFail"))}}
function derive(pass,salt,usage){
 return subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"])
  .then(km=>subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,[usage]))}
function persistOwn(pass){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 return derive(pass,salt,"encrypt")
  .then(k=>subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify({priv:OWN.priv,pub:OWN.pub,owner:OWN.owner,lic:OWN.lic}))))
  .then(ct=>{OWN.blob={app:"rn-owner",v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)};ownSaveBlob()})}
function unlockOwn(pass){
 if(!subtle)return Promise.reject(t("noCrypto"));
 if(!OWN.blob)return Promise.reject(t("keyNoFile"));
 return derive(pass,unb64(OWN.blob.salt),"decrypt")
  .then(k=>subtle.decrypt({name:"AES-GCM",iv:unb64(OWN.blob.iv)},k,unb64(OWN.blob.ct)))
  .then(pt=>{const o=JSON.parse(new TextDecoder().decode(pt));
   OWN.priv=o.priv||"";OWN.pub=o.pub||"";OWN.owner=o.owner||"";OWN.lic=Array.isArray(o.lic)?o.lic:[];
   if(!OWN.priv||!OWN.pub)throw 0;OWN.open=true;OWN_PASS=pass;
   if(o.owner&&!D.set.owner){D.set.owner=o.owner;save();sigUpd()}})}

function signLic(id,name,exp){
 const pb=b64u(new TextEncoder().encode(JSON.stringify({v:1,i:id,n:name,e:exp})));
 return subtle.importKey("pkcs8",unb64(OWN.priv),{name:"ECDSA",namedCurve:"P-256"},false,["sign"])
  .then(k=>subtle.sign({name:"ECDSA",hash:"SHA-256"},k,new TextEncoder().encode(pb)))
  .then(sig=>"RN1."+pb+"."+b64u(sig))}
function buildProtected(html){
 let out=html.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi,m=>(/rn\.license\.v1|rnGuard|data-rnpub/.test(m)?"":m));
 out=out.replace(/<script\b[^>]*data-rnpub[^>]*>\s*<\/script\s*>/gi,"");
 const rev=OWN.lic.filter(l=>l.revoked).map(l=>l.id);
 const guard=$("guardTpl").textContent.replace(/^\r?\n/,"")
  .split("__OWNER__").join(JSON.stringify(D.set.owner||OWN.owner||DEF_OWNER))
  .split("__PUBKEY__").join(OWN.pub)
  .split("__REVOKED__").join(JSON.stringify(rev))
  .split("__APPURL__").join(JSON.stringify(appBase()));
 const block='<script data-rnpub="'+OWN.pub+'"><\/script>\n<script>\n'+guard.replace(/\s+$/,"")+'\n<\/script>';
 const i=out.lastIndexOf("</body>");
 return i>=0?out.slice(0,i)+block+"\n"+out.slice(i):out.replace(/\s*$/,"")+"\n"+block+"\n"}

function summary(f){
 const L1=["✈ "+(f.n||"—"),f.al,f.ac,f.rg,f.d,f.sp?"Stand "+f.sp:""].filter(Boolean).join(" | ");
 const a=[L1,`${t("sArr")} ${f.ta||"—"} — ${t("sDep")} ${f.td||"—"} | ${t("sPax")} ${f.pa||"—"}/${f.pd||"—"}`];
 f.s.forEach(s=>{const d=dur(s.f,s.t);a.push(`• ${sname(s)} ×${s.q||1}: ${s.f||s.t?`${s.f||t("unk")}–${s.t||t("unk")}${d!=null?" ("+fmtMin(d)+")":""}`:s.dn?"✔":t("unk")}${s.w?" ⚠ "+wtxt(s):""}`)});
 if(f.nt)a.push(t("sNote")+": "+f.nt);
 return a.join("\n")+sigLine()}
function csv(){
 const cell=x=>{x=String(x??"");if(/^[=+\-@]/.test(x))x="'"+x;return`"${x.replace(/"/g,'""')}"`};
 const rows=[["Date","Flight","Airline","Type","Reg","Stand","Sched","Chocks on","Chocks off","Pax arr","Pax dep","Service","Qty","Start","End","Minutes","Target min","Over target","Done no time","Issue","Issue note","Flight notes","Transferred"]];
 D.fl.slice().sort((a,b)=>a.id-b.id).forEach(f=>{
  const base=[f.d,f.n,f.al,f.ac,f.rg,f.sp,f.st,f.ta,f.td,f.pa,f.pd];
  if(!f.s.length)rows.push([...base,"","","","","","","","","","",f.nt,f.ok?1:0]);
  f.s.forEach(s=>{const d=dur(s.f,s.t),tg=tgOf(s.k);rows.push([...base,sname(s),s.q||1,s.f,s.t,d??"",tg||"",tg&&d!=null&&d>tg?d-tg:"",s.dn?1:0,s.w?1:0,s.w?wtxt(s):"",f.nt,f.ok?1:0])})});
 rows.push([]);rows.push(["# © "+(D.set.owner||DEF_OWNER)+" — Ramp Notes — "+t("rights")]);
 return"\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")}

 case"dn":{let i=pickSv(f,p.k,"start");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.dn=1;s.f="";s.t="";return{ok:1,msg:`✔ ${nf} · ${sname(s)}: ${t("doneNoTime")}`,f,idx:i}}
 case"start":{let i=pickSv(f,p.k,"start");if(i<0)i=newSv(f,p.k);const s=f.s[i];s.f=T_;s.t="";s.dn=0;return{ok:1,msg:`▶ ${nf} · ${sname(s)} ${T_}`,f,idx:i}}
 case"end":{let i=pickSv(f,p.k,"end");if(i<0)i=newSv(f,p.k);const s=f.s[i];if(!s.f)s.f=T_;s.t=T_;s.dn=0;const d=dur(s.f,s.t);return{ok:1,msg:`■ ${nf} · ${sname(s)} ${T_}${d!=null?" ("+fmtMin(d)+")":""}`,f,idx:i}}
 case"tog":{const i=pickSv(f,p.k,"tog");if(i<0)return execCmd({t:"start",k:p.k,time:p.time},f);const s=f.s[i],st=sst(s);
  if(st==="run")return execCmd({t:"end",k:p.k,time:p.time},f);
  if(st==="done")return{ok:0,msg:`${sname(s)} — ${t("vAlready")}`};
  return execCmd({t:"start",k:p.k,time:p.time},f)}
 case"endAny":{const r=f.s.map((s,i)=>i).filter(i=>sst(f.s[i])==="run");if(!r.length)return{ok:0,msg:t("vNone")};if(r.length>1)return{ok:0,msg:t("vWhich")};return execCmd({t:"end",k:f.s[r[0]].k,time:p.time},f)}
 }
 return{ok:0,msg:t("vNo")}}
const buzz=ok=>{try{navigator.vibrate&&navigator.vibrate(ok?40:[70,50,70])}catch(e){}};
function runCmd(p,heard){
 if(p.t==="undo"){if(LASTU){const u=LASTU;LASTU=null;u();buzz(1);toast("↩ "+t("vUndone"))}else{buzz(0);toast(t("vNothing"))}return}
 let f=null;
 if(p.t!=="newf"&&p.t!=="flight"){f=curF();if(!f){buzz(0);toast(t("vNoFlight"),null,false,3500);return}}
 const u=undoer(),r=execCmd(p,f);
 if(!r.ok){buzz(0);toast(`🎙 «${heard}»\n${r.msg}`,null,false,4000);return}
 buzz(1);save();
 const g=r.f||f;
 if(g&&!r.gone){g.o=1;LASTF=g.id;if((FLT==="moved"&&!g.ok)||(FLT==="open"&&g.ok))FLT="all"}
 R1();hdr();
 if(g&&!r.gone){const el=document.querySelector(`[data-fid="${g.id}"]`+(r.idx!=null?` [data-i="${r.idx}"]`:""));if(el)el.scrollIntoView({block:r.idx!=null?"center":"start"})}
 toast(`${r.msg}\n«${heard}»`,u,false,6000)}
function onSpeech(alts){
 for(const a of alts){const p=parseCmd(a);if(p){runCmd(p,a);return}}

let REC=null,LIS=false,WANT=false,FATAL=false,LT=[];
const micLang=()=>D.set.vl==="auto"?(L()==="ar"?"ar-EG":"en-US"):D.set.vl;
function micUi(){const m=$("mic");if(!m)return;m.hidden=!(SRC&&TAB===1);m.classList.toggle("rec",LIS);m.textContent=LIS?"⏹":"🎙"}
function micToggle(){if(!SRC){toast(t("vNoSup"),null,false,3500);return}if(WANT||LIS){micStop();return}FATAL=false;LT=[];WANT=true;micStart(false)}
function micStop(){WANT=false;try{REC&&REC.abort&&REC.abort()}catch(e){}LIS=false;micUi();const el=$("toast");if(el.dataset.l==="1")el.hidden=true}
function micStart(again,langOv){
 let r;try{r=new SRC()}catch(e){WANT=false;toast(t("vNoSup"));return}
 const lang=langOv||micLang();
 REC=r;r.lang=lang;r.interimResults=true;r.continuous=false;r.maxAlternatives=5;
 r.onstart=()=>{LIS=true;micUi();if(!again)toast("🎙 "+t("vListen"),null,true)};
 r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){const alts=[];for(let j=0;j<res.length;j++)alts.push(res[j].transcript);onSpeech(alts)}else interim+=res[0].transcript}if(interim)toast("🎙 "+interim,null,true)};
 r.onerror=e=>{const c=e&&e.error;if(c==="aborted")return;
  if(c==="not-allowed"||c==="service-not-allowed"){FATAL=true;toast(t("vDenied"),null,false,4000)}
  else if(c==="network"){FATAL=true;toast(t("vNet"),null,false,4000)}
  else if(c==="audio-capture"){FATAL=true;toast(t("vNoMic"),null,false,4000)}
  else if(c==="language-not-supported"){
   if(!LT.includes(lang))LT.push(lang);
   const fb=["ar","ar-EG","ar-SA"].find(x=>!LT.includes(x)&&x!==lang);
   if(fb){setTimeout(()=>{if(WANT&&!LIS)micStart(true,fb)},300);return}
   FATAL=true;toast(t("vLangErr"),null,false,4000)}
  else if(c==="no-speech")toast(t("vNoSpeech"),null,false,2000)};
 r.onend=()=>{LIS=false;if(WANT&&D.set.vk&&!FATAL){setTimeout(()=>{if(WANT&&!LIS)micStart(true)},300)}else{WANT=false;const el=$("toast");if(el.dataset.l==="1")el.hidden=true}micUi()};
 try{r.start()}catch(e){WANT=false;micUi()}}
